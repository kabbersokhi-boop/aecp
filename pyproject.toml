[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-economic-control-plane"
version = "0.2.0"
description = "Funded agent execution, scarce-resource markets and reproducible economic experiments."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "ruff==0.16.6",
]

[project.scripts]
aecp = "aecp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aecp = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
